name: Verify real-data MVP

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify self-contained Sites build
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/index.html
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/index.html')
          text = path.read_text(encoding='utf-8')
          required = [
              '25.382 echte CGM-Werte',
              '82,22&nbsp;%',
              '138,5',
              '6,62&nbsp;%',
              '32,5&nbsp;%',
              'Frühstück gezielt protokollieren',
              'Abendliche Hochphasen aufklären',
              '18–20 Uhr als Niedrig-Zeitfenster markieren',
              "localStorage",
          ]
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit(f'Missing required real-data content: {missing}')

          forbidden = [
              'stephanmenze@gmx.de',
              'stephanmenze@icloud.com',
              'Daten - (stephanmenze',
              '.eml',
          ]
          leaks = [value for value in forbidden if value.lower() in text.lower()]
          if leaks:
              raise SystemExit(f'Direct identifier/source leak in Sites build: {leaks}')
          print('Sites build verified')
          PY
      - name: Run repository validator when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/validate_project.py ]]; then
            python scripts/validate_project.py
          fi
      - name: Run unit tests when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d tests ]]; then
            python -m unittest discover -s tests -p 'test_*.py'
          fi
