name: Verify personal-local MVP

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify public site has no patient baseline
        shell: bash
        run: |
          set -euo pipefail
          for file in docs/index.html docs/styles.css docs/app-v3.js docs/app-v3-core.js docs/app-importers.js docs/app-importers-context.js docs/app-ui-contract.js; do
            test -s "$file"
          done
          python - <<'PY'
          from pathlib import Path

          paths = (
              "docs/index.html",
              "docs/styles.css",
              "docs/app-v3.js",
              "docs/app-v3-core.js",
              "docs/app-importers.js",
              "docs/app-importers-context.js",
              "docs/app-ui-contract.js",
          )
          text = "\n".join(Path(path).read_text(encoding="utf-8") for path in paths)
          required = [
              "Ein neuer Browser startet ohne Gesundheitsdaten",
              "Noch keine persönlichen CGM-Daten",
              "glucosecoach-profile-v1",
              "glucosecoach-diary-v1",
              "glucosecoach-clinical-v1",
              "parseClinicalCsv",
              "Mahlzeitenanalyse",
              "localStorage",
              "app-v3-core.js",
              "app-importers.js",
              "app-importers-context.js",
              "app-ui-contract.js",
              "insulin_data_*.csv",
              "basal_data_*.csv",
              "bg_data_*.csv",
              "alarms_data_*.csv",
              "cgm_carbs_data_",
              "exercise_data_",
              "food_data_",
              "manual_insulin_data_",
              "medication_data_",
              "notes_data_",
              "SUPPORTED_OMNIPOD_TYPE_COUNT = 12",
          ]
          forbidden = [
              "25.382", "25382", "138.5", "6.62", "82.22", "16.55",
              "Veröffentlichter Ausgangsstand", "07.05.–04.08.2026",
              "202 mg/dl", "95 Minuten", "STATIC_BASELINE", ".eml",
          ]
          missing = [value for value in required if value not in text]
          leaks = [value for value in forbidden if value in text]
          if missing:
              raise SystemExit(f"Missing personal-local site contract: {missing}")
          if leaks:
              raise SystemExit(f"Published patient baseline leaked into site: {leaks}")
          print("Personal-local site verified")
          PY

      - name: Syntax-check E2E suite
        shell: bash
        run: |
          set -euo pipefail
          node --check e2e/oracle.cjs
          node --check e2e/glucosecoach.e2e.spec.cjs
          node --check playwright.config.cjs

      - name: Run repository validator
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_project.py

      - name: Run unit and browser-logic tests
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          python -m unittest discover -s tests -p 'test_*.py'
