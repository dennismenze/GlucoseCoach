name: Verify personal-local MVP

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Insert CI-derived visible version
        run: python scripts/stamp_site_version.py --sha "$GITHUB_SHA" --run-number "$GITHUB_RUN_NUMBER"

      - name: Verify public site has no patient baseline
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            docs/index.html \
            docs/styles.css \
            docs/app-v3.js \
            docs/app-v3-core.js \
            docs/app-importers.js \
            docs/app-importers-context.js \
            docs/app-ui-contract.js \
            docs/app-meal-window.js \
            docs/app-meal-overlap-fallback.js \
            docs/app-insulin-action.js \
            docs/app-export-core.js \
            docs/app-zip-core.js \
            docs/app-zip64-compat.js \
            docs/app-export-ui.js \
            docs/app-insulin-summary-core.js \
            docs/app-insulin-summary-ui.js \
            docs/app-all-bolus-phases.js \
            docs/app-compact-lists.js \
            docs/app-feedback-ui.js \
            docs/version.js \
            docs/app-version.js; do
            test -s "$file"
          done
          python - <<'PY'
          from pathlib import Path

          paths = (
              "docs/index.html",
              "docs/styles.css",
              "docs/app-v3.js",
              "docs/app-v3-core.js",
              "docs/app-importers.js",
              "docs/app-importers-context.js",
              "docs/app-ui-contract.js",
              "docs/app-meal-window.js",
              "docs/app-meal-overlap-fallback.js",
              "docs/app-insulin-action.js",
              "docs/app-export-core.js",
              "docs/app-zip-core.js",
              "docs/app-zip64-compat.js",
              "docs/app-export-ui.js",
              "docs/app-insulin-summary-core.js",
              "docs/app-insulin-summary-ui.js",
              "docs/app-all-bolus-phases.js",
              "docs/app-compact-lists.js",
              "docs/app-feedback-ui.js",
              "docs/version.js",
              "docs/app-version.js",
          )
          text = "\n".join(Path(path).read_text(encoding="utf-8") for path in paths)
          required = [
              "Ein neuer Browser startet ohne Gesundheitsdaten",
              "Noch keine persönlichen CGM-Daten",
              "glucosecoach-profile-v1",
              "glucosecoach-diary-v1",
              "glucosecoach-clinical-v1",
              "parseClinicalCsv",
              "Mahlzeitenanalyse",
              "Insulinwirkung",
              "localStorage",
              "app-v3-core.js",
              "app-importers.js",
              "app-importers-context.js",
              "app-ui-contract.js",
              "app-meal-window.js",
              "app-meal-overlap-fallback.js",
              "app-insulin-action.js",
              "app-export-core.js",
              "app-zip-core.js",
              "app-zip64-compat.js",
              "app-export-ui.js",
              "app-all-bolus-phases.js",
              "app-compact-lists.js",
              "app-feedback-ui.js",
              "version.js",
              "app-version.js",
              "glucosecoach-food-library-v1",
              "Boluszeitpunkt bei wiederholten Mahlzeiten",
              "Abendlicher Anstieg ohne protokollierte Mahlzeit",
              "glucosecoach-csv-v1",
              "glucosecoach-omnipod-zip-v1",
              "ZIP64-Größenangaben",
              "CSV-ZIP herunterladen",
              "ZIP hier ablegen",
              "glucosecoach_data_1.csv",
              "cgm_data_1.csv",
              "bolus_data_1.csv",
              "meal-events-disclosure",
              "diary-entries-disclosure",
              "GLUCOSECOACH_VERSION",
              "insulin_data_*.csv",
              "basal_data_*.csv",
              "bg_data_*.csv",
              "alarms_data_*.csv",
              "cgm_carbs_data_",
              "exercise_data_",
              "food_data_",
              "manual_insulin_data_",
              "medication_data_",
              "notes_data_",
              "SUPPORTED_OMNIPOD_TYPE_COUNT = 12",
              "GC_TWO_HOUR_REFERENCE_MINUTES",
              "GC_MEAL_CONTEXT_MINUTES",
              "GC_MEAL_BOLUS_ASSOCIATION_MINUTES",
              "GC_DECLINE_CONFIRMATION_MINUTES",
              "GC_DECLINE_DROP_MGDL",
              "nicht mehr auf zwei Stunden begrenzt",
              "mahlzeitennaher positiver Bolus",
              "starten den Peak nicht neu",
              "mögliche Korrekturen",
              "2-h-Wert bleibt nur ein Referenzwert",
              "pharmakologischen Insulin-Wirkbeginns",
              "maximum-before-next-meal-bolus",
              "Ersatz für 2-h-Wert",
              "analyzeInsulinAction",
              "ACTION_WINDOW_MINUTES = 300",
              "MIN_CGM_COVERAGE = 0.80",
              "END_REMAINING_FRACTION = 0.10",
              "Beobachteter Wirkeintritt über alle Boli",
              "GC_ALL_BOLUS_PHASE_WINDOW_MINUTES",
              "CLEAR_RISE_MGDL_PER_15_MIN = 6",
              "TURN_DROP_MGDL = 8",
              "keine Empfehlung zur Änderung von Pumpenparametern",
          ]
          forbidden = [
              "25.382", "25382", "138.5", "6.62", "82.22", "16.55",
              "Veröffentlichter Ausgangsstand", "07.05.–04.08.2026",
              "202 mg/dl", "95 Minuten", "STATIC_BASELINE", ".eml",
          ]
          missing = [value for value in required if value not in text]
          leaks = [value for value in forbidden if value in text]
          if missing:
              raise SystemExit(f"Missing personal-local site contract: {missing}")
          if leaks:
              raise SystemExit(f"Published patient baseline leaked into site: {leaks}")

          export_core = Path("docs/app-export-core.js").read_text(encoding="utf-8")
          redundant = [
              value for value in ("Rohdaten_JSON", "Zeitstempel_lokal", "buildBackupPayload")
              if value in export_core
          ]
          if redundant:
              raise SystemExit(f"Redundant export contract returned: {redundant}")
          print("Personal-local meal, all-bolus, ZIP/CSV, compact-list, feedback and version site verified")
          PY

      - name: Syntax-check browser and E2E modules
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/app-v3.js
          node --check docs/app-meal-window.js
          node --check docs/app-meal-overlap-fallback.js
          node --check docs/app-insulin-action.js
          node --check docs/app-all-bolus-phases.js
          node --check docs/app-export-core.js
          node --check docs/app-zip-core.js
          node --check docs/app-zip64-compat.js
          node --check docs/app-export-ui.js
          node --check docs/app-insulin-summary-core.js
          node --check docs/app-insulin-summary-ui.js
          node --check docs/app-compact-lists.js
          node --check docs/app-feedback-ui.js
          node --check docs/app-version.js
          node --check tests/sites_logic_test.cjs
          node --check tests/postprandial_peak_test.cjs
          node --check tests/insulin_action_test.cjs
          node --check tests/all_bolus_phases_test.cjs
          node --check tests/meal_overlap_fallback_test.cjs
          node --check tests/feedback_analysis_test.cjs
          node --check tests/zip_exchange_test.cjs
          node --check tests/zip64_fixture.cjs
          node --check tests/zip64_compat_test.cjs
          node --check e2e/oracle.cjs
          node --check e2e/oracle-two-hour-patch.cjs
          node --check e2e/insulin-action-oracle.cjs
          node --check e2e/glucosecoach.e2e.spec.cjs
          node --check e2e/postprandial-peak.e2e.spec.cjs
          node --check e2e/insulin-action.e2e.spec.cjs
          node --check e2e/complete-export.e2e.spec.cjs
          node --check e2e/insulin-summary-ui.e2e.spec.cjs
          node --check e2e/compact-version.e2e.spec.cjs
          node --check e2e/feedback-ui.e2e.spec.cjs
          node --check e2e/zip64-import.e2e.spec.cjs
          node --check e2e/all-bolus-phases-meal-overlap.e2e.spec.cjs
          node --check e2e/run-playwright.cjs
          node --check playwright.config.cjs
          python -m py_compile scripts/stamp_site_version.py
          python -m py_compile tests/test_feedback_analysis.py

      - name: Run repository validator
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_project.py

      - name: Run unit and browser-logic tests
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          python -m unittest discover -s tests -p 'test_*.py'
          node tests/zip_exchange_test.cjs
          node tests/zip64_compat_test.cjs
          node tests/all_bolus_phases_test.cjs
          node tests/meal_overlap_fallback_test.cjs
