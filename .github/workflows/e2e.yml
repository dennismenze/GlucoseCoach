name: Browser E2E

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'e2e/**'
      - 'scripts/stamp_site_version.py'
      - 'playwright.config.cjs'
      - 'package.json'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'e2e/**'
      - 'scripts/stamp_site_version.py'
      - 'playwright.config.cjs'
      - 'package.json'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Insert CI-derived visible version
        run: python scripts/stamp_site_version.py --sha "$GITHUB_SHA" --run-number "$GITHUB_RUN_NUMBER"
      - name: Install Playwright test runner
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run deterministic randomized E2E matrix
        run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
