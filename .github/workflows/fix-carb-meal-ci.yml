name: Fix carbohydrate-meal CI expectations

on:
  push:
    branches: [fix/include-carb-only-meals]
    paths:
      - '.github/workflows/fix-carb-meal-ci.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/include-carb-only-meals
          fetch-depth: 0
      - name: Correct test contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          unit = Path('tests/carb_only_meal_analysis_test.cjs')
          text = unit.read_text(encoding='utf-8')
          old = """const filteredGroups = app.buildFoodComparisons([
            carbOnly[0],
            { ...direct, entry: { ...direct.entry, food: 'Apfel' } },
          ]);
          assert.equal(filteredGroups.length, 1);
          assert.equal(filteredGroups[0].entries, 1);
          assert.equal(filteredGroups[0].analyzed, 1);"""
          new = """const filteredGroups = app.buildFoodComparisons([
            carbOnly[0],
            {
              ...carbOnly[0],
              entry: { ...carbOnly[0].entry, id: 'carb-only-copy', food: 'Apfel' },
            },
            { ...direct, entry: { ...direct.entry, food: 'Apfel' } },
          ]);
          assert.equal(filteredGroups.length, 1);
          assert.equal(filteredGroups[0].entries, 2);
          assert.equal(filteredGroups[0].analyzed, 2);"""
          if old not in text:
              raise SystemExit('unit-test contract block not found')
          unit.write_text(text.replace(old, new), encoding='utf-8')

          e2e = Path('e2e/postprandial-peak.e2e.spec.cjs')
          text = e2e.read_text(encoding='utf-8')
          old = "test('a blank-carbohydrate insulin delivery remains a correction while the carbohydrate meal is analyzed'"
          new = "test('blank-carbohydrate bolus cannot anchor a meal peak while the carbohydrate meal is analyzed'"
          if old not in text:
              raise SystemExit('postprandial test title not found')
          e2e.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm -f .github/workflows/fix-carb-meal-ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix carbohydrate-meal test contracts'
          git push origin HEAD:fix/include-carb-only-meals
