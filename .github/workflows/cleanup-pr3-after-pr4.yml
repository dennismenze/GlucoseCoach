name: Close superseded meal-analysis PR

on:
  push:
    branches: [main]

permissions:
  pull-requests: write
  contents: read

jobs:
  close-superseded-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Close PR 3 once PR 4 is merged
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          merged=$(gh api "repos/$REPO/pulls/4" --jq .merged)
          state=$(gh api "repos/$REPO/pulls/3" --jq .state)
          if [ "$merged" = true ] && [ "$state" = open ]; then
            gh pr close 3 --repo "$REPO" --comment 'Superseded by PR 4, which contains the corrected post-peak hysteresis plus the complete insulin-action analysis and its tests.'
          fi
