name: Apply meal peak correction-bolus patch

on:
  push:
    branches:
      - 'fix/meal-peak-correction-bolus'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and unpack generated patch
        shell: bash
        run: |
          set -euo pipefail
          test -f tmp/gc-patch.part05
          # Repair the one transport-only split typo, then ignore harmless whitespace.
          sed -i 's/BNleRf ndziWT6/BNleRfNdziWT6/' tmp/gc-patch.part02
          cat tmp/gc-patch.part* | tr -d '[:space:]' | base64 --decode > /tmp/gc-patch.tar.gz
          echo '7881a4267d5433fab42ba1160ebe9a226e65e14105e5e50e161de49022acf960  /tmp/gc-patch.tar.gz' | sha256sum --check --strict
          tar -tzf /tmp/gc-patch.tar.gz | diff -u - <(cat <<'FILES'
          AGENTS.md
          .github/workflows/verify-real-mvp.yml
          docs/app-meal-window.js
          e2e/glucosecoach.e2e.spec.cjs
          e2e/oracle-two-hour-patch.cjs
          e2e/postprandial-peak.e2e.spec.cjs
          tests/postprandial_peak_test.cjs
          tests/test_sites_v2.py
          FILES
          )
          tar -xzf /tmp/gc-patch.tar.gz
          rm -rf tmp .github/workflows/apply-meal-peak-patch.yml

      - name: Run focused verification before committing
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/app-meal-window.js
          node --check e2e/oracle-two-hour-patch.cjs
          node --check e2e/glucosecoach.e2e.spec.cjs
          node --check e2e/postprandial-peak.e2e.spec.cjs
          node --check tests/postprandial_peak_test.cjs
          python -m py_compile tests/test_sites_v2.py
          node tests/postprandial_peak_test.cjs
          python scripts/validate_project.py

      - name: Commit final branch contents
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: keep correction boluses out of meal peak anchoring'
          git push origin HEAD:fix/meal-peak-correction-bolus
