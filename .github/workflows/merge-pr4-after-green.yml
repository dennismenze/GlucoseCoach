name: Merge PR 4 after all required checks

on:
  workflow_run:
    workflows:
      - Browser E2E
      - Verify personal-local MVP
      - Validate analysis pipeline
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  gate-and-merge:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Merge only when all three PR-head workflows are green
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: '4'
        shell: bash
        run: |
          set -euo pipefail
          state=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .state)
          test "$state" = open || exit 0

          head_ref=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.ref)
          test "$head_ref" = insulin-action-analysis || exit 0
          head_sha=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)

          runs=$(gh api --paginate "repos/$REPO/actions/runs?event=pull_request&head_sha=$head_sha&per_page=100")
          for workflow in 'Browser E2E' 'Verify personal-local MVP' 'Validate analysis pipeline'; do
            status=$(jq -r --arg name "$workflow" --arg sha "$head_sha" '
              [.workflow_runs[] | select(.name == $name and .head_sha == $sha)]
              | sort_by(.created_at) | last
              | if . == null then "missing" else (.status + ":" + (.conclusion // "")) end
            ' <<<"$runs")
            echo "$workflow: $status"
            test "$status" = completed:success || exit 0
          done

          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch \
            --subject 'feat: estimate personal effective bolus action' \
            --body 'Includes the 2-hour meal peak, post-peak hysteretic decline proxy, and bounded personal insulin-action estimates. Browser E2E, Verify personal-local MVP, and Validate analysis pipeline were all successful for the merged PR head.'
