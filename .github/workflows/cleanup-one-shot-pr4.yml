name: Remove one-shot PR 4 finalization files

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR 4 state
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: echo "merged=$(gh api repos/$REPO/pulls/4 --jq .merged)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        if: steps.pr.outputs.merged == 'true'
        with:
          token: ${{ github.token }}
      - name: Remove temporary files if they reached main
        if: steps.pr.outputs.merged == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm --ignore-unmatch \
            ci/finalize_pr4.py \
            ci/pr4-recheck.txt \
            .github/workflows/apply-pr4-finalization.yml \
            .github/workflows/cleanup-one-shot-pr4.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: remove one-shot PR 4 finalization files'
          git push
