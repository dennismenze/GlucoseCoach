name: Stamp visible site version

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/site-version.js'

permissions:
  contents: write

concurrency:
  group: stamp-visible-site-version
  cancel-in-progress: true

jobs:
  stamp:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate version from CI build and commit
        run: python scripts/stamp_site_version.py
      - name: Publish stamped version file
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/site-version.js; then
            echo 'Version file is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/site-version.js
          git commit -m 'chore: stamp visible site version [skip ci]'
          git push origin HEAD:main
