name: Apply carbohydrate-based bolus classification

on:
  push:
    branches:
      - fix/bolus-without-carbs-is-correction

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/bolus-without-carbs-is-correction
          fetch-depth: 0

      - name: Apply classification and regression-test patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/bolus-classification.py.gz
          echo '839f09b79989b82bd93fca8c053e680cc99a9ad18541e07b4b1a518a0b1c6e41  /tmp/bolus-classification.py.gz' | sha256sum --check --strict
          gzip --decompress --stdout /tmp/bolus-classification.py.gz > /tmp/bolus-classification.py
          python /tmp/bolus-classification.py

      - name: Run focused verification
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/app-insulin-action.js
          node --check docs/app-meal-window.js
          node --check e2e/insulin-action-oracle.cjs
          node --check e2e/insulin-action.e2e.spec.cjs
          node --check e2e/oracle-two-hour-patch.cjs
          node --check e2e/postprandial-peak.e2e.spec.cjs
          node --check tests/insulin_action_test.cjs
          node --check tests/postprandial_peak_test.cjs
          python -m py_compile tests/test_sites_v2.py
          node tests/insulin_action_test.cjs
          node tests/postprandial_peak_test.cjs
          python scripts/validate_project.py

      - name: Commit product and test changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            AGENTS.md \
            docs/app-insulin-action.js \
            docs/app-meal-window.js \
            e2e/insulin-action-oracle.cjs \
            e2e/insulin-action.e2e.spec.cjs \
            e2e/oracle-two-hour-patch.cjs \
            e2e/postprandial-peak.e2e.spec.cjs \
            tests/insulin_action_test.cjs \
            tests/postprandial_peak_test.cjs \
            tests/test_sites_v2.py
          git commit -m 'fix: classify boluses without carbs as corrections'
          git push origin HEAD:fix/bolus-without-carbs-is-correction
