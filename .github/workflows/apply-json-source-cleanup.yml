name: Apply one-shot JSON source cleanup

on:
  push:
    branches: [feature/remove-json-source-remnants]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/remove-json-source-remnants
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove obsolete source controls and handlers
        run: python scripts/apply_json_source_cleanup.py
      - name: Check changed browser modules
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/app-v3-core.js
          node --check docs/app-importers.js
          node --check docs/app-importers-context.js
          node --check docs/app-v3.js
          node --check docs/app-export-ui.js
          git diff --check
      - name: Commit cleaned sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/index.html docs/app-v3-core.js docs/app-importers.js docs/app-importers-context.js docs/app-v3.js docs/app-export-ui.js
          git commit -m 'refactor: remove obsolete JSON exchange source code'
          git push
