name: Finalize real-data MVP

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-real-mvp-20260816.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Select validated prepared tree and publish it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PARENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          candidates=(
            0dd25ff89224a7e5a1dc37c9ad323b0aa1a42e46
            6334f29231c90330cce863f75ebc8fb297cf038e
            002a0e14ae27fd2a3eb56b0d4dd0a5e5a1667cf6
            add254049a1f9f72ab20a96ab56aa6b4cd2e9e3e
            a94c74c56dfccfb6915df0a762bf1f6fc650e48d
            59a0e899c75ca8f150e82ce8e04d02166ea998b4
            0fa8eeb5b96a7fdb9f7a272b237087cbaae212ab
            a3442fbad90e87b94c9fd8e96a09c159ede2f728
            efc18497b632c373d546bec6a33ad12f2566122d
            a48af025575b1a0b5e224a2a2fe8af882a0bc1d1
            6e26c4cf99c73b8989d2073e674e4e6e75521036
            9738532830ba0c4c111d13128f29773b3a1561c3
            b0726002c6a4a8698eaa83c01586079cc0f2da8a
            3773cbe3613d0e9c3fdaebd331656c42b750fad8
          )

          required=(
            README.md
            index.html
            assets/styles.css
            src/app.js
            scripts/build_dataset.py
            scripts/validate_project.py
          )

          chosen=""
          chosen_json=""
          for tree in "${candidates[@]}"; do
            json="$(mktemp)"
            if ! gh api "repos/${REPOSITORY}/git/trees/${tree}?recursive=1" >"${json}" 2>/dev/null; then
              rm -f "${json}"
              continue
            fi

            truncated="$(jq -r '.truncated // true' "${json}")"
            [[ "${truncated}" == "false" ]] || { rm -f "${json}"; continue; }

            ok=true
            for path in "${required[@]}"; do
              jq -e --arg p "${path}" '.tree[] | select(.path == $p and .type == "blob")' "${json}" >/dev/null || ok=false
            done

            data_count="$(jq '[.tree[] | select(.type == "blob" and (.path | startswith("data/")))] | length' "${json}")"
            data_bytes="$(jq '[.tree[] | select(.type == "blob" and (.path | startswith("data/"))) | (.size // 0)] | add // 0' "${json}")"
            forbidden_count="$(jq '[.tree[] | select(.type == "blob" and ((.path | ascii_downcase | endswith(".eml")) or (.path | ascii_downcase | endswith(".zip")) or (.path | ascii_downcase | endswith(".csv"))))] | length' "${json}")"

            [[ "${data_count}" -ge 10 ]] || ok=false
            [[ "${data_bytes}" -ge 100000 ]] || ok=false
            [[ "${forbidden_count}" -eq 0 ]] || ok=false

            if [[ "${ok}" == "true" ]]; then
              chosen="${tree}"
              chosen_json="${json}"
              break
            fi
            rm -f "${json}"
          done

          [[ -n "${chosen}" ]] || { echo "No prepared tree passed validation" >&2; exit 1; }

          file_count="$(jq '[.tree[] | select(.type == "blob")] | length' "${chosen_json}")"
          data_count="$(jq '[.tree[] | select(.type == "blob" and (.path | startswith("data/")))] | length' "${chosen_json}")"
          data_bytes="$(jq '[.tree[] | select(.type == "blob" and (.path | startswith("data/"))) | (.size // 0)] | add // 0' "${chosen_json}")"

          marker_content="$(cat <<EOF
# Finalized real-data MVP

This marker was generated by the fail-closed repository finalizer.

- source tree: ${chosen}
- files: ${file_count}
- data files: ${data_count}
- data bytes: ${data_bytes}
- raw EML/ZIP/CSV files: 0
- finalized at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
EOF
)"
          marker_blob="$(printf '%s' "${marker_content}" | base64 -w0 | jq -Rn '{content: input, encoding: "base64"}' | gh api --method POST "repos/${REPOSITORY}/git/blobs" --input - --jq .sha)"
          final_tree="$(jq -n --arg base "${chosen}" --arg blob "${marker_blob}" '{base_tree: $base, tree: [{path: "FINALIZED.md", mode: "100644", type: "blob", sha: $blob}]}' | gh api --method POST "repos/${REPOSITORY}/git/trees" --input - --jq .sha)"
          commit_sha="$(jq -n --arg message "feat: publish de-identified real-data GlucoseCoach MVP" --arg tree "${final_tree}" --arg parent "${PARENT_SHA}" '{message: $message, tree: $tree, parents: [$parent]}' | gh api --method POST "repos/${REPOSITORY}/git/commits" --input - --jq .sha)"

          jq -n --arg sha "${commit_sha}" '{sha: $sha, force: false}' | gh api --method PATCH "repos/${REPOSITORY}/git/refs/heads/main" --input - >/dev/null
          echo "Published ${commit_sha} from tree ${chosen}"
