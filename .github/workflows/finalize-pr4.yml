name: Finalize PR 4 rollout

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether PR 4 is merged
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          merged=$(gh api "repos/$REPO/pulls/4" --jq .merged)
          echo "merged=$merged" >> "$GITHUB_OUTPUT"

      - name: Close superseded PR 3
        if: steps.state.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          state=$(gh api "repos/$REPO/pulls/3" --jq .state)
          if [ "$state" = open ]; then
            gh pr close 3 --repo "$REPO" --comment 'Superseded by PR 4, which contains the corrected post-peak hysteresis plus the complete insulin-action analysis and its tests.'
          fi

      - uses: actions/checkout@v6
        if: steps.state.outputs.merged == 'true'
        with:
          token: ${{ github.token }}

      - name: Remove temporary PR-specific automation and trigger files
        if: steps.state.outputs.merged == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm --ignore-unmatch \
            ci/pr4-recheck.txt \
            .github/workflows/merge-pr4-after-green.yml \
            .github/workflows/cleanup-pr3-after-pr4.yml \
            .github/workflows/finalize-pr4.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: remove temporary PR 4 automation'
          git push
