name: Apply and verify PR 4 finalization

on:
  pull_request:
    branches: [main]
    paths:
      - 'ci/finalize_pr4.py'
      - '.github/workflows/apply-pr4-finalization.yml'
      - 'docs/**'
      - 'tests/**'
      - 'e2e/**'
      - 'package.json'
      - 'playwright.config.cjs'

permissions:
  contents: write

jobs:
  apply-test-and-push:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'insulin-action-analysis'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply deterministic finalization
        run: python ci/finalize_pr4.py

      - name: Install test dependencies
        run: |
          pip install -r requirements.txt
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run all repository and browser tests before pushing
        run: |
          set -euo pipefail
          node --check docs/app-v3.js
          node --check docs/app-meal-window.js
          node --check docs/app-insulin-action.js
          node tests/sites_logic_test.cjs
          node tests/postprandial_peak_test.cjs
          node tests/insulin_action_test.cjs
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/validate_project.py
          npm run test:e2e

      - name: Remove one-shot automation and push verified result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm --ignore-unmatch \
            ci/finalize_pr4.py \
            ci/pr4-recheck.txt \
            .github/workflows/apply-pr4-finalization.yml
          git add docs/app-v3.js docs/app-meal-window.js docs/index.html e2e/postprandial-peak.e2e.spec.cjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: finalize meal hysteresis and insulin analysis contracts'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
